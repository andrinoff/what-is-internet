<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@fontsource/mona-sans@5.0.1/index.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css"
            id="hljs-light"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css"
            id="hljs-dark"
            disabled
        />
        <style>
            :root {
                --bg: #ffffff;
                --bg-secondary: #f8f9fa;
                --text: #1a1a1a;
                --text-muted: #6c757d;
                --code-bg: #f5f5f5;
                --border: #e0e0e0;
                --link: #0066cc;
                --accent: #5c6bc0;
                --shadow: rgba(0, 0, 0, 0.1);
            }
            [data-theme="dark"] {
                --bg: #1a1a1a;
                --bg-secondary: #242424;
                --text: #e0e0e0;
                --text-muted: #9e9e9e;
                --code-bg: #2d2d2d;
                --border: #404040;
                --link: #6db3f2;
                --accent: #7c8ae6;
                --shadow: rgba(0, 0, 0, 0.3);
            }

            * {
                box-sizing: border-box;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                font-family:
                    "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, sans-serif;
                line-height: 1.7;
                color: var(--text);
                background: var(--bg);
                margin: 0;
                padding: 0;
                transition:
                    background 0.3s,
                    color 0.3s;
            }

            /* Header bar */
            .header {
                position: sticky;
                top: 0;
                background: var(--bg-secondary);
                border-bottom: 1px solid var(--border);
                padding: 0.5rem 1rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 100;
                backdrop-filter: blur(10px);
            }
            .header-left {
                display: flex;
                align-items: center;
                gap: 1rem;
            }
            .meta {
                display: flex;
                gap: 1rem;
                font-size: 0.85rem;Contents
                color: var(--text-muted);
            }
            .controls {
                display: flex;
                gap: 0.5rem;
                align-items: center;
            }
            .controls button,
            .controls select {
                background: var(--bg);
                border: 1px solid var(--border);
                color: var(--text);
                padding: 0.4rem 0.8rem;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.85rem;
                transition: all 0.2s;
            }
            .controls button:hover {
                border-color: var(--accent);
            }
            .theme-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                padding: 0;
            }
            .theme-toggle svg {
                transition:
                    transform 0.3s,
                    opacity 0.3s;
            }
            .icon-moon {
                display: none;
            }
            [data-theme="dark"] .icon-sun {
                display: none;
            }
            [data-theme="dark"] .icon-moon {
                display: block;
            }

            /* Progress bar */
            .progress-bar {
                position: fixed;
                top: 0;
                left: 0;
                height: 3px;
                background: var(--accent);
                width: 0%;
                z-index: 101;
                transition: width 0.1s;
            }

            /* Main content */
            .container {
                max-width: 800px;
                margin: 0 auto;
                padding: 2rem 1rem 4rem;
            }
            article {
                font-size: 1rem;
            }

            /* Typography */
            h1,
            h2,
            h3,
            h4,
            h5,
            h6 {
                margin-top: 2em;
                margin-bottom: 0.5em;
                line-height: 1.3;
            }
            h1 {
                font-size: 2.2em;
                border-bottom: 2px solid var(--border);
                padding-bottom: 0.3em;
                margin-top: 0;
            }
            h2 {
                font-size: 1.6em;
            }
            h3 {
                font-size: 1.3em;
            }
            h2,
            h3 {
                border-bottom: 1px solid var(--border);
                padding-bottom: 0.2em;
            }
            p {
                margin: 1em 0;
            }
            a {
                color: var(--link);
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }

            /* Code */
            code {
                font-family:
                    "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas,
                    monospace;
                background: var(--code-bg);
                padding: 0.2em 0.4em;
                border-radius: 4px;
                font-size: 0.9em;
            }
            pre {
                background: var(--code-bg);
                padding: 1rem;
                overflow-x: auto;
                border-radius: 8px;
                border: 1px solid var(--border);
                position: relative;
            }
            pre code {
                padding: 0;
                background: none;
                font-size: 0.85rem;
                line-height: 1.5;
            }
            .code-block {
                position: relative;
            }
            .code-lang {
                position: absolute;
                top: 0;
                right: 0;
                background: var(--border);
                color: var(--text-muted);
                padding: 0.2rem 0.6rem;
                font-size: 0.75rem;
                border-radius: 0 8px 0 8px;
                text-transform: uppercase;
            }
            .copy-btn {
                position: absolute;
                top: 0.5rem;
                right: 0.5rem;
                background: var(--bg);
                border: 1px solid var(--border);
                color: var(--text-muted);
                padding: 0.3rem 0.6rem;
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.75rem;
                opacity: 0;
                transition: opacity 0.2s;
            }
            pre:hover .copy-btn {
                opacity: 1;
            }
            .copy-btn:hover {
                color: var(--text);
            }

            /* Blockquote */
            blockquote {
                border-left: 4px solid var(--accent);
                margin: 1.5em 0;
                padding: 0.5em 1em;
                background: var(--bg-secondary);
                border-radius: 0 8px 8px 0;
            }
            blockquote p {
                margin: 0.5em 0;
            }

            /* Tables */
            table {
                border-collapse: collapse;
                width: 100%;
                margin: 1.5em 0;
                overflow-x: auto;
                display: block;
            }
            th,
            td {
                border: 1px solid var(--border);
                padding: 0.75rem 1rem;
                text-align: left;
            }
            th {
                background: var(--bg-secondary);
                font-weight: 600;
            }
            tr:hover td {
                background: var(--bg-secondary);
            }

            /* Lists */
            ul,
            ol {
                padding-left: 1.5em;
            }
            li {
                margin: 0.3em 0;
            }
            li::marker {
                color: var(--accent);
            }

            /* Images */
            img {
                max-width: 100%;
                height: auto;
                border-radius: 8px;
                box-shadow: 0 4px 12px var(--shadow);
            }

            /* Math */
            .math-display {
                overflow-x: auto;
                padding: 1.5rem 0;
                text-align: center;
            }

            /* Horizontal rule */
            hr {
                border: none;
                height: 2px;
                background: var(--border);
                margin: 2em 0;
            }

            /* Table of contents - sidebar */
            .toc {
                position: fixed;
                left: 0;
                top: 50%;
                transform: translateY(-50%);
                z-index: 50;
                display: flex;
                align-items: center;
            }
            .toc-toggle {
                background: var(--bg-secondary);
                border: 1px solid var(--border);
                border-left: none;
                border-radius: 0 8px 8px 0;
                padding: 0.75rem 0.5rem;
                cursor: pointer;
                color: var(--text-muted);
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s;
            }
            .toc-toggle:hover {
                color: var(--text);
                background: var(--bg);
            }
            .toc-toggle svg {
                transition: transform 0.3s;
            }
            .toc.open .toc-toggle svg {
                transform: rotate(180deg);
            }
            .toc-panel {
                position: absolute;
                left: 0;
                top: 50%;
                transform: translateX(-100%) translateY(-50%);
                background: var(--bg-secondary);
                border: 1px solid var(--border);
                border-radius: 0 8px 8px 0;
                padding: 1rem 1.25rem;
                max-height: 70vh;
                overflow-y: auto;
                min-width: 220px;
                max-width: 280px;
                box-shadow: 4px 0 12px var(--shadow);
                transition: transform 0.3s ease;
            }
            .toc.open .toc-panel {
                transform: translateX(0) translateY(-50%);
            }
            .toc-title {
                font-weight: 600;
                margin-bottom: 0.75rem;
                color: var(--text);
                font-size: 0.9rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }
            .toc ul {
                list-style: none;
                padding-left: 0;
                margin: 0;
            }
            .toc li {
                margin: 0.4em 0;
            }
            .toc a {
                color: var(--text-muted);
                font-size: 0.85rem;
                display: block;
                padding: 0.2rem 0;
                transition: color 0.2s;
            }
            .toc a:hover {
                color: var(--link);
                text-decoration: none;
            }
            .toc .toc-h3 {
                padding-left: 1em;
            }
            .toc .toc-h4 {
                padding-left: 2em;
                font-size: 0.8rem;
            }

            @media (max-width: 1100px) {
                .toc {
                    display: none;
                }
            }

            /* Back to top */
            .back-to-top {
                position: fixed;
                bottom: 2rem;
                right: 2rem;
                background: var(--accent);
                color: white;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                border: none;
                cursor: pointer;
                opacity: 0;
                transform: translateY(10px);
                transition: all 0.3s;
                font-size: 1.2rem;
                box-shadow: 0 4px 12px var(--shadow);
            }
            .back-to-top.visible {
                opacity: 1;
                transform: translateY(0);
            }
            .back-to-top:hover {
                transform: translateY(-2px);
            }

            /* Print styles */
            @media print {
                .header,
                .progress-bar,
                .back-to-top,
                .copy-btn {
                    display: none;
                }
                body {
                    background: white;
                    color: black;
                }
                .container {
                    max-width: none;
                    padding: 0;
                }
            }

            /* Footer */
            .footer {
                background: var(--bg-secondary);
                border-top: 1px solid var(--border);
                padding: 2rem 1rem;
                margin-top: 4rem;
                text-align: center;
                color: var(--text-muted);
                font-size: 0.9rem;
            }
            .footer a {
                color: var(--link);
            }
            .footer-content {
                max-width: 800px;
                margin: 0 auto;
            }
            .footer-links {
                display: flex;
                justify-content: center;
                gap: 1.5rem;
                margin-bottom: 1rem;
                flex-wrap: wrap;
            }
            .footer-links a {
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
            }
            .footer-text {
                margin-top: 0.5rem;
            }

            /* Mobile */
            @media (max-width: 600px) {
                .header {
                    flex-direction: column;
                    gap: 0.5rem;
                }
                .meta {
                    font-size: 0.8rem;
                }
                h1 {
                    font-size: 1.8em;
                }
            }

            @media print {
                .footer {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="progress-bar" id="progress"></div>

        <header class="header">
            <div class="header-left">
                <div class="meta">
                    <span id="read-time"></span>
                    <span id="word-count"></span>
                    <span id="last-modified"></span>
                </div>
            </div>
            <div class="controls">
                <button
                    id="theme-toggle"
                    class="theme-toggle"
                    title="Toggle theme"
                >
                    <svg
                        class="icon-sun"
                        xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line
                            x1="18.36"
                            y1="18.36"
                            x2="19.78"
                            y2="19.78"
                        ></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg
                        class="icon-moon"
                        xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                        ></path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="container">
            <article id="content"></article>
        </div>

        <footer class="footer" id="footer"></footer>

        <button class="back-to-top" id="back-to-top" title="Back to top">
            ↑
        </button>

        <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
        <script>
            // Theme management
            const themeToggle = document.getElementById("theme-toggle");
            const hljsLight = document.getElementById("hljs-light");
            const hljsDark = document.getElementById("hljs-dark");

            function getSystemTheme() {
                return window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light";
            }

            function applyTheme(theme) {
                document.documentElement.setAttribute("data-theme", theme);

                // Switch highlight.js theme
                const isDark = theme === "dark";
                hljsLight.disabled = isDark;
                hljsDark.disabled = !isDark;

                localStorage.setItem("theme", theme);
            }

            // Initialize theme
            const savedTheme = localStorage.getItem("theme");
            applyTheme(savedTheme || getSystemTheme());

            // Toggle between light and dark
            themeToggle.addEventListener("click", () => {
                const current =
                    document.documentElement.getAttribute("data-theme");
                applyTheme(current === "dark" ? "light" : "dark");
            });

            // Listen for system theme changes
            window
                .matchMedia("(prefers-color-scheme: dark)")
                .addEventListener("change", (e) => {
                    if (!localStorage.getItem("theme")) {
                        applyTheme(e.matches ? "dark" : "light");
                    }
                });

            // Progress bar
            window.addEventListener("scroll", () => {
                const scrollTop = window.scrollY;
                const docHeight =
                    document.documentElement.scrollHeight - window.innerHeight;
                const progress =
                    docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
                document.getElementById("progress").style.width =
                    progress + "%";

                // Back to top button
                const btn = document.getElementById("back-to-top");
                btn.classList.toggle("visible", scrollTop > 300);
            });

            document
                .getElementById("back-to-top")
                .addEventListener("click", () => {
                    window.scrollTo({ top: 0, behavior: "smooth" });
                });

            // Parse frontmatter config
            function parseConfig(md) {
                const config = {
                    author: "",
                    contribute_url: "",
                    contribute_text: "Contribute to this page",
                    license: "",
                    license_url: "",
                    footer_text: "",
                };

                const match = md.match(/^---\n([\s\S]*?)\n---\n/);
                if (match) {
                    const yaml = match[1];
                    yaml.split("\n").forEach((line) => {
                        const [key, ...valueParts] = line.split(":");
                        if (key && valueParts.length) {
                            const value = valueParts
                                .join(":")
                                .trim()
                                .replace(/^["']|["']$/g, "");
                            config[key.trim()] = value;
                        }
                    });
                    md = md.slice(match[0].length);
                }
                return { config, content: md };
            }

            // Render footer
            function renderFooter(config) {
                const footer = document.getElementById("footer");
                const links = [];

                if (config.contribute_url) {
                    links.push(
                        `<a href="${config.contribute_url}" target="_blank" rel="noopener">${config.contribute_text}</a>`,
                    );
                }
                if (config.license && config.license_url) {
                    links.push(
                        `<a href="${config.license_url}" target="_blank" rel="noopener">${config.license}</a>`,
                    );
                } else if (config.license) {
                    links.push(`<span>${config.license}</span>`);
                }

                const hasContent =
                    links.length > 0 || config.author || config.footer_text;
                if (!hasContent) {
                    footer.style.display = "none";
                    return;
                }

                let html = '<div class="footer-content">';
                if (links.length > 0) {
                    html += `<div class="footer-links">${links.join("")}</div>`;
                }
                if (config.author) {
                    html += `<div class="footer-text">Written by ${config.author}</div>`;
                }
                html += `<div class="footer-text">Made with
                    <a href="https://github.com/andrinoff/latex-doc-template">Latex Doc Template</a></div>`;

                html += "</div>";

                footer.innerHTML = html;
            }

            // Main render function
            async function render() {
                const res = await fetch("content.md");
                let mdRaw = await res.text();
                const lastModified = new Date(res.headers.get("Last-Modified"));

                // Parse config and get content
                const { config, content } = parseConfig(mdRaw);
                let md = content;

                // Calculate stats
                const plainText = md
                    .replace(/[#*`\[\]()!]/g, "")
                    .replace(/\$\$?[\s\S]*?\$\$?/g, "");
                const words = plainText
                    .trim()
                    .split(/\s+/)
                    .filter((w) => w.length > 0).length;
                const readTime = Math.max(1, Math.ceil(words / 200));

                document.getElementById("read-time").textContent =
                    `${readTime} min read`;
                document.getElementById("word-count").textContent =
                    `${words.toLocaleString()} words`;
                if (lastModified.getTime() > 0) {
                    document.getElementById("last-modified").textContent =
                        `Updated ${lastModified.toLocaleDateString()}`;
                }

                // Extract and replace LaTeX blocks before markdown parsing
                const blocks = [];
                const inlines = [];

                // Block math: $$ ... $$
                md = md.replace(/\$\$([\s\S]*?)\$\$/g, (_, tex) => {
                    blocks.push(tex.trim());
                    return `%%BLOCK_${blocks.length - 1}%%`;
                });

                // Inline math: $ ... $ (not preceded/followed by $)
                md = md.replace(
                    /(?<!\$)\$(?!\$)([^\$\n]+?)\$(?!\$)/g,
                    (_, tex) => {
                        inlines.push(tex.trim());
                        return `%%INLINE_${inlines.length - 1}%%`;
                    },
                );

                // Custom marked renderer
                const renderer = new marked.Renderer();

                // Add IDs to headings for TOC
                const headings = [];
                renderer.heading = function (text, level) {
                    // Handle both marked v12 object format and older string format
                    const headingText =
                        typeof text === "object" ? text.text : text;
                    const headingLevel =
                        typeof text === "object" ? text.depth : level;

                    const slug = headingText
                        .toLowerCase()
                        .replace(/[^\w]+/g, "-");
                    headings.push({
                        text: headingText,
                        level: headingLevel,
                        slug,
                    });
                    return `<h${headingLevel} id="${slug}">${headingText}</h${headingLevel}>`;
                };

                // Wrap code blocks
                renderer.code = function (code, lang) {
                    // Handle both marked v12 object format and older string format
                    const codeText =
                        typeof code === "object" ? code.text : code;
                    const codeLang =
                        typeof code === "object" ? code.lang : lang;

                    const language = codeLang || "plaintext";
                    let highlighted;
                    try {
                        highlighted =
                            codeLang && hljs.getLanguage(codeLang)
                                ? hljs.highlight(codeText, {
                                      language: codeLang,
                                  }).value
                                : hljs.highlightAuto(codeText).value;
                    } catch (e) {
                        highlighted = codeText;
                    }
                    return `<div class="code-block"><pre><code class="hljs language-${language}">${highlighted}</code></pre><span class="code-lang">${language}</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>`;
                };

                marked.setOptions({ renderer, breaks: true });

                // Parse markdown
                let html = marked.parse(md);

                // Restore block math
                html = html.replace(/%%BLOCK_(\d+)%%/g, (_, i) => {
                    try {
                        return `<div class="math-display">${katex.renderToString(blocks[i], { displayMode: true, throwOnError: false })}</div>`;
                    } catch (e) {
                        return `<pre class="math-error">${blocks[i]}</pre>`;
                    }
                });

                // Restore inline math
                html = html.replace(/%%INLINE_(\d+)%%/g, (_, i) => {
                    try {
                        return katex.renderToString(inlines[i], {
                            displayMode: false,
                            throwOnError: false,
                        });
                    } catch (e) {
                        return `<code class="math-error">${inlines[i]}</code>`;
                    }
                });

                // Generate TOC sidebar if there are multiple headings
                if (headings.length > 2) {
                    const tocHtml = `
                        <button class="toc-toggle" aria-label="Toggle table of contents">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </button>
                        <div class="toc-panel">
                            <div class="toc-title">Contents</div>
                            <ul>${headings
                                .filter((h) => h.level <= 4 && h.level > 1)
                                .map(
                                    (h) =>
                                        `<li class="toc-h${h.level}"><a href="#${h.slug}">${h.text}</a></li>`,
                                )
                                .join("")}</ul>
                        </div>`;

                    // Create or update TOC element
                    let tocEl = document.getElementById("toc-sidebar");
                    if (!tocEl) {
                        tocEl = document.createElement("nav");
                        tocEl.id = "toc-sidebar";
                        tocEl.className = "toc";
                        document.body.appendChild(tocEl);
                    }
                    tocEl.innerHTML = tocHtml;

                    // Add toggle functionality
                    tocEl
                        .querySelector(".toc-toggle")
                        .addEventListener("click", () => {
                            tocEl.classList.toggle("open");
                        });

                    // Close when clicking a link
                    tocEl.querySelectorAll("a").forEach((link) => {
                        link.addEventListener("click", () => {
                            tocEl.classList.remove("open");
                        });
                    });
                }

                document.getElementById("content").innerHTML = html;
                document.title =
                    document.querySelector("h1")?.textContent || "Document";

                // Render footer
                renderFooter(config);
            }

            // Copy code function
            function copyCode(btn) {
                const code =
                    btn.parentElement.querySelector("code").textContent;
                navigator.clipboard.writeText(code).then(() => {
                    btn.textContent = "Copied!";
                    setTimeout(() => (btn.textContent = "Copy"), 2000);
                });
            }

            render();
        </script>
    </body>
</html>
